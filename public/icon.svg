<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="50%" stop-color="#0f1f33"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#1e293b" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Quant Candlestick / Volatility Bars in Background -->
  <g opacity="0.25">
    <line x1="140" y1="200" x2="140" y2="340" stroke="#10b981" stroke-width="4"/>
    <rect x="125" y="230" width="30" height="70" rx="4" fill="#10b981"/>

    <line x1="220" y1="160" x2="220" y2="360" stroke="#06b6d4" stroke-width="4"/>
    <rect x="205" y="190" width="30" height="110" rx="4" fill="#06b6d4"/>

    <line x1="300" y1="120" x2="300" y2="320" stroke="#10b981" stroke-width="4"/>
    <rect x="285" y="140" width="30" height="90" rx="4" fill="#10b981"/>

    <line x1="380" y1="100" x2="380" y2="280" stroke="#10b981" stroke-width="4"/>
    <rect x="365" y="120" width="30" height="80" rx="4" fill="#10b981"/>
  </g>

  <!-- Central VRD Lightning Zap Icon with Glow -->
  <path d="M285 70 L155 270 L255 270 L225 442 L355 242 L255 242 Z"
        fill="url(#primaryGrad)"
        filter="url(#glow)"/>

  <!-- Badge Text -->
  <rect x="156" y="420" width="200" height="42" rx="21" fill="#0b1320" stroke="#10b981" stroke-width="2"/>
  <text x="256" y="447" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="3">
    VRD QUANT
  </text>
</svg>
